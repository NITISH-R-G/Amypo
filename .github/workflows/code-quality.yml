name: Code Quality & Security Scans

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Checks & Generate Reports
        run: |
          mkdir -p reports
          npx prettier --check . > reports/prettier-report.txt || true
          npx eslint . --format json --output-file reports/eslint-report.json || true
          npx tsc --noEmit > reports/tsc-report.txt || true
          npx knip --reporter json > reports/knip-report.json || true
          npx jscpd . --reporters json --output reports/ || true
          mv reports/jscpd-report.json reports/jscpd-report.json 2>/dev/null || true
          npx secretlint "**/*" --format json > reports/secretlint-report.json || true
          npx license-checker --json > reports/license-report.json || true
          npm audit --json > reports/npm-audit-report.json || true
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file reports/sbom.json || true

      - name: Run AI QA Agent
        run: node scripts/ai-qa-agent.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_STEP_SUMMARY: $GITHUB_STEP_SUMMARY
