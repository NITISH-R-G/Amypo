apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eval-platform-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/eval-platform-monorepo.git'
    targetRevision: main
    path: infrastructure/k8s
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: eval-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
